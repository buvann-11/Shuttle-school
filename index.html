<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shuttle School: learn badminton strokes step by step</title>
    <meta
      name="description"
      content="Learn badminton strokes visually, step by step, without a coach. Animated lessons for grips, footwork, clears, smashes, drops, serves and net play."
    />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="theme-color" content="#edf1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1613" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shuttle School" />
    <meta property="og:title" content="Shuttle School: learn badminton strokes step by step" />
    <meta
      property="og:description"
      content="Animated, step-by-step badminton lessons you can learn from without a coach. Works offline."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A stick figure hitting a smash, with the step name and coaching cue above it"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Shuttle School" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('shuttle-school:v1:settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Shuttle School needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
