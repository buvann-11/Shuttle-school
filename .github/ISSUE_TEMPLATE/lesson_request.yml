name: Lesson or technique fix
description: Suggest a new lesson, or correct a step, cue or drill
labels: [content]
body:
  - type: input
    id: stroke
    attributes:
      label: Stroke
      placeholder: e.g. Backhand clear
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should it teach, or what is wrong?
      description: Steps, cues and common mistakes. Links to a coaching source help.
    validations:
      required: true
