name: Bug report
description: Something looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: lesson
    attributes:
      label: Lesson
      placeholder: e.g. Smash, step 4
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 7, Chrome 142
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Drag an image in here if you can.
